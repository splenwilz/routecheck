# Test lifecycle with path interpolation
# Uses httpbin's /anything endpoint which accepts any path
lifecycles:
  - name: httpbin-interpolation-test
    description: Test path interpolation with captured values
    create:
      method: POST
      path: /post
      body:
        user_id: "abc-123-xyz"
        resource_type: "test-resource"
      expected_status: [200]
      capture:
        user_id: "$.json.user_id"
        resource_type: "$.json.resource_type"
    cleanup:
      # Path uses interpolation - httpbin /anything accepts any subpath
      method: DELETE
      path: /anything/users/{{user_id}}/resources/{{resource_type}}
      expected_status: [200]
